const remaining=id=>{const i=state.ingredients.find(x=>x.id===id);return i?Math.max(0,(i.totalQty||0)-(i.usedQty||0)):0};
function available(p){if(!Array.isArray(p.recipe)||!p.recipe.length)return 0;return Math.max(0,Math.min(...p.recipe.map(r=>Math.floor(remaining(r.id)/r.qty))))}
function rawOrder(lines=state.cart,products=state.products,promos=state.promos,ingredients=state.ingredients){const pm=new Map(products.map(p=>[p.id,p]));const needs=new Map();const totals=[];let subtotal=0,extrasTotal=0;for(const line of lines){const p=pm.get(line.productId);if(!p||p.hidden)throw Error('商品已下架');const qty=int(line.qty,'份數',1,10000);let addTotal=0;for(const r of p.recipe){needs.set(r.id,(needs.get(r.id)||0)+qty*r.qty)}for(const e of line.extras||[]){if(p.category!=='冰淇淋')throw Error('加購類型有誤');const option=(p.addonOptions||[]).find(o=>o.id===e.id);if(!option)throw Error('加購口味已修改');const n=int(e.qty,'球數',1,1000);needs.set(e.id,(needs.get(e.id)||0)+n);addTotal+=option.price*n}const gross=p.price*qty;subtotal+=gross;extrasTotal+=addTotal;totals.push({...line,product:p,gross,addTotal,lineTotal:gross+addTotal,discount:0})}for(const [id,q] of needs){const i=ingredients.find(x=>x.id===id);if(!i||q>i.totalQty-i.usedQty)throw Error((i?.name||'原料')+'庫存不足')}let discount=0;const used=new Map();for(const offer of [...promos].filter(p=>p.enabled).sort((a,b)=>a.id.localeCompare(b.id))){if(offer.productA===offer.productB)continue;const a=totals.filter(l=>l.productId===offer.productA),b=totals.filter(l=>l.productId===offer.productB);if(!a.length||!b.length)continue;const aQty=a.reduce((s,l)=>s+l.qty,0)- (used.get(offer.productA)||0),bQty=b.reduce((s,l)=>s+l.qty,0)-(used.get(offer.productB)||0);let pairs=Math.min(aQty,bQty);const bProduct=pm.get(offer.productB);if(!bProduct||!Number.isSafeInteger(offer.price)||offer.price<0||offer.price>bProduct.price)continue;const per=bProduct.price-offer.price;let left=pairs;for(const line of b){const usable=line.qty-(line.discount/per||0);const take=per>0?Math.min(left,Math.max(0,usable)):0;line.discount+=take*per;line.lineTotal-=take*per;left-=take;if(!left)break}discount+=pairs*per;used.set(offer.productA,(used.get(offer.productA)||0)+pairs);used.set(offer.productB,(used.get(offer.productB)||0)+pairs)}const total=totals.reduce((s,l)=>s+l.lineTotal,0);if(!Number.isSafeInteger(total)||total<0||total>1e7)throw Error('金額超出範圍');return{lines:totals,needs:Object.fromEntries(needs),subtotal,extrasTotal,discount,total}}
function summary(){return rawOrder()}
function renderStats(){const revenue=state.sales.filter(s=>s.status==='valid').reduce((a,s)=>a+(s.total||0),0),sold=state.sales.filter(s=>s.status==='valid').reduce((a,s)=>a+(s.lines||[]).reduce((x,l)=>x+l.qty,0),0),stock=state.ingredients.reduce((a,i)=>a+Math.max(0,i.totalQty-i.usedQty),0),cost=state.ingredients.reduce((a,i)=>a+i.totalQty*i.unitCost,Number(state.settings.sharedCost||0));$('vRevenue').textContent=money(revenue);$('vSold').textContent=sold+' 份';$('vStock').textContent=stock;$('vRecover').textContent=money(Math.max(0,cost-revenue));$('vCost').textContent='總成本 '+money(cost)}

async function openSession(u){state.user=u;const seat=seatOf(u);if(!Number.isInteger(seat)){await signOut(auth);return}if(seat===26){state.role='super';state.name=''}else{const p=await getDoc(doc(db,'accounts',u.uid));if(!p.exists()||p.data().seat!==seat){toast('帳號未經授權',true);await signOut(auth);return}state.role=p.data().role;state.name=p.data().name||''}state.cart=[];$('loginPage').classList.add('hidden');$('appPage').classList.remove('hidden');$('logoutBtn').classList.remove('hidden');$('userChip').classList.remove('hidden');$('userChip').textContent=seat+' 號 · '+({super:'最高管理員',admin:'管理員',teacher:'老師',student:'學生'}[state.role]||'學生');document.querySelector('[data-tab="admin"]').classList.toggle('hidden',!isManager());document.querySelector('[data-tab="audit"]').classList.toggle('hidden',!isManager());$('accountsPanel').classList.toggle('hidden',!isSuper());$('exportSales').classList.toggle('hidden',!isSuper());$('exportAudit').classList.toggle('hidden',!isSuper());tab('checkout');listen()}

async function saveIngredient(e){e.preventDefault();if(state.busy)return;const name=$('ingredientName').value.trim(),unit=$('ingredientUnit').value.trim(),totalQty=int($('ingredientTotal').value,'進貨數量'),unitCost=int($('ingredientCost').value,'進貨成本');if(!name||!unit)throw Error('請填名稱和單位');state.busy=true;try{const ref=state.editIngredient?doc(db,'ingredients',state.editIngredient):doc(collection(db,'ingredients'));await runTransaction(db,async tx=>{const old=await tx.get(ref);const used=old.exists()?old.data().usedQty:0;if(totalQty<used)throw Error('進貨量不得低於已使用量');if(old.exists())tx.update(ref,{name,unit,totalQty,unitCost,updatedAt:serverTimestamp()});else tx.set(ref,{name,unit,totalQty,unitCost,usedQty:0,createdAt:serverTimestamp()})});await logged('ingredient.save',name,ref.id);$('ingredientDialog').close();toast('庫存已儲存')}catch(err){toast(err.message,true)}finally{state.busy=false}}

async function checkout(){if(state.busy||!navigator.onLine)return;let local;try{local=summary()}catch(e){toast(e.message,true);return}const paid=int($('paid').value,'實收金額');if(paid<local.total)return;state.busy=true;$('confirmCheckout').disabled=true;try{const id=state.pendingOrderId;const ref=doc(db,'sales',id);const promoSnap=await getDocs(collection(db,'promotions'));const promos=promoSnap.docs.map(d=>({id:d.id,...d.data()}));const result=await runTransaction(db,async tx=>{const existing=await tx.get(ref);if(existing.exists()){if(existing.data().actorUid!==state.user.uid)throw Error('訂單編號衝突');return {total:existing.data().total,duplicate:true}}const ids=[...new Set(state.cart.map(l=>l.productId))];const pRefs=ids.map(x=>doc(db,'products',x));const ps=await Promise.all(pRefs.map(x=>tx.get(x)));const products=ps.map((s,i)=>{if(!s.exists())throw Error('商品不存在');return{id:ids[i],...s.data()}});const needIds=[...new Set(state.cart.flatMap(l=>{const p=products.find(p=>p.id===l.productId);return [...p.recipe.map(r=>r.id),...(l.extras||[]).map(e=>e.id)]}))];if(needIds.length>12||ids.length>4)throw Error('單筆品項或原料種類過多，請拆單');const iRefs=needIds.map(x=>doc(db,'ingredients',x));const is=await Promise.all(iRefs.map(x=>tx.get(x)));const ingredients=is.map((s,i)=>{if(!s.exists())throw Error('原料缺失');return{id:needIds[i],...s.data()}});const promoRefs=promos.map(x=>doc(db,'promotions',x.id));const promoCurrent=(await Promise.all(promoRefs.map(x=>tx.get(x)))).filter(x=>x.exists()).map(x=>({id:x.id,...x.data()}));const calc=rawOrder(state.cart,products,promoCurrent,ingredients);if(calc.total!==local.total)throw Error('商品價格或優惠已改變，請重新核對');if(paid<calc.total)throw Error('付款不足');const lines=calc.lines.map(l=>({productId:l.productId,name:l.product.name,category:l.product.category,unit:l.product.unit,price:l.product.price,qty:l.qty,extras:l.extras,gross:l.gross,addonTotal:l.addTotal,discount:l.discount,lineTotal:l.lineTotal}));tx.set(ref,{lines,needs:calc.needs,total:calc.total,discount:calc.discount,paid,change:paid-calc.total,status:'valid',hidden:false,actorUid:state.user.uid,actorName:actor(),seat:seatOf(state.user),createdAt:serverTimestamp()});for(let j=0;j<ids.length;j++){const p=products[j],part=calc.lines.filter(x=>x.productId===p.id),q=part.reduce((s,l)=>s+l.qty,0),rev=part.reduce((s,l)=>s+l.lineTotal,0);tx.update(pRefs[j],{sold:(p.sold||0)+q,revenue:(p.revenue||0)+rev,updatedAt:serverTimestamp(),lastOrderId:id})}for(let j=0;j<needIds.length;j++){const ing=ingredients[j];tx.update(iRefs[j],{usedQty:ing.usedQty+calc.needs[ing.id],updatedAt:serverTimestamp(),lastOrderId:id})}tx.set(doc(db,'audit',id),{action:'checkout',summary:'結帳 '+money(calc.total),subjectId:id,actorUid:state.user.uid,actorName:actor(),seat:seatOf(state.user),createdAt:serverTimestamp(),hidden:false});return{total:calc.total,duplicate:false}});state.cart=[];state.pendingOrderId=null;$('confirmDialog').close();toast((result.duplicate?'訂單已存在：':'結帳完成：')+money(result.total));render()}catch(e){toast('結帳失敗：'+e.message,true)}finally{state.busy=false;updateChange()}}
function openRefund(id){const s=state.sales.find(x=>x.id===id);if(!s||s.status!=='valid')return;state.refundId=id;$('refundDescription').textContent='退款金額：'+money(s.total);$('refundReason').value='';$('refundDialog').showModal()}
async function refund(){const reason=$('refundReason').value.trim();if(!reason){toast('請填退款原因',true);return}if(state.busy)return;state.busy=true;try{const id=state.refundId,ref=doc(db,'sales',id);await runTransaction(db,async tx=>{const ss=await tx.get(ref);if(!ss.exists()||ss.data().status!=='valid')throw Error('訂單已退款或不存在');const s=ss.data(),ids=[...new Set(s.lines.map(x=>x.productId))],needed=Object.keys(s.needs);const pr=ids.map(x=>doc(db,'products',x)),ir=needed.map(x=>doc(db,'ingredients',x));const ps=await Promise.all(pr.map(x=>tx.get(x))),ins=await Promise.all(ir.map(x=>tx.get(x)));if([...ps,...ins].some(x=>!x.exists()))throw Error('資料不存在，無法退回');tx.update(ref,{status:'voided',refundReason:reason,refundedByUid:state.user.uid,refundedAt:serverTimestamp()});for(let j=0;j<ids.length;j++){const p=ps[j].data(),lines=s.lines.filter(x=>x.productId===ids[j]),qty=lines.reduce((v,x)=>v+x.qty,0),amt=lines.reduce((v,x)=>v+x.lineTotal,0);if(p.sold<qty||p.revenue<amt)throw Error('銷售帳目不正確');tx.update(pr[j],{sold:p.sold-qty,revenue:p.revenue-amt,updatedAt:serverTimestamp(),lastRefundId:id})}for(let j=0;j<needed.length;j++){const used=ins[j].data().usedQty;if(used<s.needs[needed[j]])throw Error('原料帳目不正確');tx.update(ir[j],{usedQty:used-s.needs[needed[j]],updatedAt:serverTimestamp(),lastRefundId:id})}tx.set(doc(collection(db,'audit')),{action:'refund',summary:'退款 '+money(s.total)+'；'+reason,subjectId:id,actorUid:state.user.uid,actorName:actor(),seat:seatOf(state.user),createdAt:serverTimestamp(),hidden:false})});$('refundDialog').close();toast('退款完成')}catch(e){toast(e.message,true)}finally{state.busy=false}}
async function hideRecord(type,id){if(!isSuper())return;const message=type==='sales'?'刪除這筆銷售的顯示紀錄？不會更動已收金額及庫存；需要退款請先操作退款。':'刪除這筆操作紀錄的顯示？';if(!confirm(message))return;try{await runTransaction(db,async tx=>{const ref=doc(db,type,id),snap=await tx.get(ref);if(!snap.exists())throw Error('紀錄不存在');if(type==='sales'&&snap.data().status==='valid')throw Error('請先退款，再刪除這筆銷售紀錄');tx.update(ref,{hidden:true,hiddenBy:state.user.uid,hiddenAt:serverTimestamp()});tx.set(doc(collection(db,'audit')),{action:type+'.hide',summary:'26 號刪除'+(type==='sales'?'銷售':'操作')+'紀錄',subjectId:id,actorUid:state.user.uid,actorName:actor(),seat:26,createdAt:serverTimestamp(),hidden:false})});toast('紀錄已從列表移除')}catch(e){toast(e.message,true)}}
async function saveSettings(){try{const stallName=$('stallName').value.trim(),sharedCost=int($('sharedCost').value,'共同支出');await setDoc(doc(db,'meta','settings'),{stallName,sharedCost,updatedAt:serverTimestamp()},{merge:true});await logged('settings','修改攤位設定');toast('已儲存')}catch(e){toast(e.message,true)}}
async function savePromo(e){e.preventDefault();const a=$('promoA').value,b=$('promoB').value,price=int($('promoPrice').value,'加購價'),name=$('promoName').value.trim();if(a===b)throw Error('A、B 不可相同');const p=state.products.find(x=>x.id===b);if(!p||price>p.price)throw Error('加購價不可高於原售價');try{const ref=doc(collection(db,'promotions'));await setDoc(ref,{productA:a,productB:b,price,name,enabled:true,createdAt:serverTimestamp()});await logged('promo.save',name,ref.id);toast('優惠已儲存')}catch(err){toast(err.message,true)}}
async function createAccount(e){e.preventDefault();if(!isSuper())return;const raw=$('newSeat').value.trim(),seat=Number(raw),password=$('newPassword').value,role=$('newRole').value,name=$('newName').value.trim();if(!/^(00|0?[1-9]|[1-9]\d)$/.test(raw)||seat===26||password.length<6)throw Error('座號或密碼格式錯誤');let sub=null;try{sub=initializeApp(config,'create-'+Date.now());const subAuth=getAuth(sub),email='seat-'+(seat===0?'00':seat)+'@school-22aa0.firebaseapp.com';const created=await createUserWithEmailAndPassword(subAuth,email,password);await setDoc(doc(db,'accounts',created.user.uid),{seat,role,name,email,createdBy:state.user.uid,createdAt:serverTimestamp()});await signOut(subAuth);await logged('account.create','建立 '+seat+' 號',created.user.uid);$('createAccountForm').reset();toast('新增完成')}catch(e){toast('建立帳號失敗：'+e.message,true)}finally{if(sub)await deleteApp(sub)}}
async function setAccountRole(uid,role){if(!isSuper())return;try{await runTransaction(db,async tx=>{const ref=doc(db,'accounts',uid),p=await tx.get(ref);if(!p.exists())throw Error('帳號不存在');tx.update(ref,{role,updatedBy:state.user.uid,updatedAt:serverTimestamp()})});await logged('role.change','變更帳號權限',uid);toast('權限已更新')}catch(e){toast(e.message,true)}}
function downloadCsv(type){if(!isSuper())return;const data=type==='sales'?state.sales:state.audit;const headers=type==='sales'?['ID','時間','金額','狀態','收銀人員','退款原因']:['ID','時間','人員','動作','內容'];const rows=data.map(x=>type==='sales'?[x.id,x.createdAt?.toDate?.().toLocaleString('zh-TW')||'',x.total,x.status,x.actorName,x.refundReason||'']:[x.id,x.createdAt?.toDate?.().toLocaleString('zh-TW')||'',x.actorName,x.action,x.summary]);const cell=x=>'"'+String(x??'').replace(/^[=+\-@]/,"'").replaceAll('"','""')+'"';const csv='\ufeff'+[headers,...rows].map(r=>r.map(cell).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='高一丁_'+type+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
function setTheme(dark){document.body.classList.toggle('dark',dark);$('themeBtn').textContent=dark?'☀️ 淺色':'🌙 深色';localStorage.setItem('gy-theme',dark?'dark':'light')}setTheme(localStorage.getItem('gy-theme')==='dark');$('themeBtn').onclick=()=>setTheme(!document.body.classList.contains('dark'));
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).close());$('loginForm').onsubmit=async e=>{e.preventDefault();try{const raw=$('seat').value.trim();if(!/^(00|0?[1-9]|[1-9]\d)$/.test(raw))throw Error('座號格式不正確');$('loginBtn').disabled=true;await signInWithEmailAndPassword(auth,'seat-'+(Number(raw)===0?'00':Number(raw))+'@school-22aa0.firebaseapp.com',$('password').value);$('password').value=''}catch(err){$('loginError').textContent='登入失敗：'+err.message}finally{$('loginBtn').disabled=false}};$('logoutBtn').onclick=()=>signOut(auth);
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));$('productSearch').oninput=renderProducts;$('productGrid').onclick=e=>{const b=e.target.closest('[data-add]');if(!b)return;const p=state.products.find(x=>x.id===b.dataset.add);if(p.category==='冰淇淋')openIce(p.id);else{try{addItem(p.id)}catch(err){toast(err.message,true)}}};$('iceQty').oninput=updateIcePrice;$('iceFlavors').oninput=updateIcePrice;$('addIceToCart').onclick=()=>{try{const {p,qty,extras}=selectedIce();addItem(p.id,qty,extras);$('iceDialog').close()}catch(e){toast(e.message,true)}};
$('openCart').onclick=()=>{renderCart();$('cartDialog').showModal()};$('cartLines').onclick=e=>{const b=e.target.closest('[data-remove-cart]');if(!b)return;state.cart=state.cart.filter(l=>l.key!==b.dataset.removeCart);state.pendingOrderId=null;renderCart();renderCartBar()};$('toConfirm').onclick=showConfirm;$('backCart').onclick=()=>{$('confirmDialog').close();renderCart();$('cartDialog').showModal()};$('paid').oninput=updateChange;$('confirmCheckout').onclick=checkout;
$('addIngredient').onclick=()=>openIngredient();$('ingredientForm').onsubmit=saveIngredient;$('ingredientList').onclick=e=>{const b=e.target.closest('[data-edit-ingredient]');if(b)openIngredient(b.dataset.editIngredient)};$('addProduct').onclick=()=>openProduct();$('productAdminList').onclick=e=>{const b=e.target.closest('[data-edit-product]');if(b)openProduct(b.dataset.editProduct)};$('productType').onchange=updateType;$('addRecipe').onclick=()=>recipeRow();$('addAddonOption').onclick=()=>addonRow();$('recipeRows').onclick=$('addonOptionRows').onclick=e=>{if(e.target.closest('[data-remove-row]'))e.target.closest('.addon-row').remove()};$('productForm').onsubmit=saveProduct;$('saveSettings').onclick=saveSettings;$('promoForm').onsubmit=savePromo;$('createAccountForm').onsubmit=createAccount;
$('accountsList').onchange=e=>{const x=e.target.closest('[data-role-uid]');if(x)setAccountRole(x.dataset.roleUid,x.value)};$('salesList').onclick=e=>{const a=e.target.closest('[data-refund]'),b=e.target.closest('[data-remove-sale]');if(a)openRefund(a.dataset.refund);else if(b)hideRecord('sales',b.dataset.removeSale)};$('auditList').onclick=e=>{const b=e.target.closest('[data-remove-audit]');if(b)hideRecord('audit',b.dataset.removeAudit)};$('confirmRefund').onclick=refund;$('exportSales').onclick=()=>downloadCsv('sales');$('exportAudit').onclick=()=>downloadCsv('audit');
await setPersistence(auth,browserSessionPersistence);onAuthStateChanged(auth,async u=>{for(const f of state.unsubs)f();state.unsubs=[];state.user=u;if(!u){state.role=null;state.name='';$('loginPage').classList.remove('hidden');$('appPage').classList.add('hidden');$('logoutBtn').classList.add('hidden');$('userChip').classList.add('hidden');$('syncStatus').textContent='尚未登入';return}try{await openSession(u)}catch(err){toast(err.message,true);await signOut(auth)}});
